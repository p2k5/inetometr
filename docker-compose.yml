version: '3.8'

services:
  inetometr:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - INETOMETR_DATA=/app/data/speed_data.json
      - INETOMETR_DB=/app/data/speed_data.db
      - INETOMETR_ADMIN_TOKEN=${INETOMETR_ADMIN_TOKEN:-change_me_please}
      - INETOMETR_FORCE_HTTPS=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Дополнительный сервис для мониторинга (опционально)
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

volumes:
  data: