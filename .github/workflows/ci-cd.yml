name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/

    - name: Build Docker image
      run: |
        docker build -t inetometr:${{ github.sha }} .

    - name: Test Docker container
      run: |
        docker run -d --name inetometr-test -p 8080:8080 \
          -e INETOMETR_ADMIN_TOKEN=testtoken \
          inetometr:${{ github.sha }}
        # Wait for container to start
        sleep 10
        # Test health endpoint
        curl -f http://localhost:8080/health
        # Test API endpoint
        curl -f http://localhost:8080/api/status
        # Stop container
        docker stop inetometr-test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inetometr:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/inetometr:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inetometr:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inetometr:buildcache,mode=max