[project]
name = "inetometr"
version = "0.1.0"
description = "Сервис измерения скорости интернета в стиле Яндекс-Интернетометр"
authors = [
    { name = "Pavel Shabanov", email = "x.pasha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.142.2",
    "ping3>=5.1.6",
    "uvicorn[standard]>=0.54.0",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
inetometr = "inetometr:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"