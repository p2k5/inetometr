[project]
name = "inetometr"
version = "0.1.0"
description = "Сервис измерения скорости интернета в стиле Яндекс-Интернетометр"
authors = [
    { name = "Pavel Shabanov", email = "x.pasha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.142.2",
    "ping3>=5.1.6",
    "uvicorn[standard]>=0.54.0",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
inetometr = "inetometr:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────────
# Linting & formatting (Ruff)
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["inetometr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────
# Test configuration
# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"